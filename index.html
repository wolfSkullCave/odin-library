<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="stylesheets/style.css" />
    <link rel="stylesheet" href="stylesheets/layout.css" />

    <title>Library: wolf_SkullCave</title>
  </head>
  <body>
    <div class="grid-container">
      <div class="header">
        <div class="bgOverlay">
          <header>
            <h1>My Personal Library</h1>
            <p>Track your reading journey, one book at a time.</p>
          </header>
        </div>
      </div>

      <div class="main">
        <div class="Books">
          <div class="books-heading">
            <h1>My Reading List</h1>
            <button id="refreshList">Refresh</button>
          </div>

          <div class="book-list"></div>
        </div>

        <div class="sidebar">
          <div class="book-form" id="newBookForm">
            <h3>New book form</h3>
            <form action="" id="bookForm">
              <fieldset class="form-grid">
                <label for="title">Book title</label>
                <input type="text" name="title" id="title" />

                <label for="author">Author</label>
                <input type="text" name="author" id="author" />

                <label for="pages">Number of pages</label>
                <input type="text" name="pages" id="pages" />
              </fieldset>

              <fieldset class="readStatus">
                <legend>Have you read this book yet?</legend>
                <!-- <label for="read">Have you read this book yet?</label> -->
                <input type="radio" name="read" id="read-yes" value="true" />
                <label for="read-yes">Yes</label>
                <input type="radio" name="read" id="read-no" value="false" />
                <label for="read-no">No</label>
              </fieldset>
              <button type="submit">Submit</button>
            </form>
          </div>
        </div>
      </div>

      <div class="footer">
          <img src="assets/github-mark-white.png" alt="" />
          <a href="http://github.com/wolfSkullCave"> Follow me on GitHub </a>
      </div>
    </div>
    <script src="scripts/script.js"></script>
  </body>
</html>
